# ==========================================================================
# SentinelStream configuration
# Update db.* to match your local PostgreSQL instance before running.
# ==========================================================================

# --- Database connection (used by both the JDBC pool and Hibernate) ---
db.url=jdbc:postgresql://localhost:5432/sentinel_stream_db
db.user=postgres
db.password=your_secure_password
db.pool.size=8

# --- Pipeline tuning ---
pipeline.log.file=server_traffic.log
pipeline.consumer.threads=4
pipeline.buffer.capacity=10000

# --- Mock data generation ---
mockdata.target.size.mb=50
